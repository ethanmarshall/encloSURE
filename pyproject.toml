[project]
name = "enclosure-sure"
version = "0.2.0"
description = "Make a PCB and its enclosure fit: read the enclosure, write KiCad board limits, check the finished board's fit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["build123d>=0.10"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
enclosure = "enclosure.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["enclosure"]
